<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruin - Dungeon Explorer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0f1a;
      color: white;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    h1 {
      margin-bottom: 10px;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }
    
    .info {
      margin-bottom: 20px;
      text-align: center;
      opacity: 0.8;
    }
    
    canvas {
      border: 2px solid #00ff88;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }
    
    .loading {
      margin-top: 20px;
      color: #ffaa00;
    }
  </style>
</head>
<body>
  <h1>🏰 RUIN</h1>
  <div class="info">
    <p>TypeScript + PixiJS Game Engine Test</p>
    <p>A rotating green square should appear below</p>
  </div>
  <div class="loading">Loading game...</div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
